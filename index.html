<style>
:root{box-sizing:border-box;--bg:#dde4ee;--bg1:radial-gradient(900px 480px at 6% -10%,rgba(13,148,136,.20) 0,transparent 60%),radial-gradient(800px 460px at 100% 0,rgba(79,70,229,.17) 0,transparent 58%);--card:#ffffff;--card2:#f1f4f9;--tx:#0e1a2c;--mut:#4f5f76;--bd:rgba(14,26,44,.18);--sh:0 1px 2px rgba(14,26,44,.07),0 12px 30px -14px rgba(14,26,44,.32);--ac:#0a7d73;--ac2:#4338ca;--ok:#047857;--wn:#b45309;--bad:#be123c;--inp:#eaeff6;--ring:rgba(10,125,115,.30)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0b1020;--bg1:radial-gradient(900px 520px at 8% -10%,rgba(45,212,191,.16) 0,transparent 60%),radial-gradient(900px 520px at 100% 0,rgba(129,140,248,.2) 0,transparent 58%);--card:rgba(22,30,56,.82);--card2:rgba(32,42,74,.55);--tx:#e9eefb;--mut:#a5b4d2;--bd:rgba(148,163,184,.17);--sh:0 16px 38px -18px rgba(0,0,0,.75);--ac:#2dd4bf;--ac2:#818cf8;--ok:#34d399;--wn:#fbbf24;--bad:#fb7185;--inp:rgba(8,13,28,.62);--ring:rgba(45,212,191,.35)}}
:root[data-theme="dark"]{--bg:#0b1020;--bg1:radial-gradient(900px 520px at 8% -10%,rgba(45,212,191,.16) 0,transparent 60%),radial-gradient(900px 520px at 100% 0,rgba(129,140,248,.2) 0,transparent 58%);--card:rgba(22,30,56,.82);--card2:rgba(32,42,74,.55);--tx:#e9eefb;--mut:#a5b4d2;--bd:rgba(148,163,184,.17);--sh:0 16px 38px -18px rgba(0,0,0,.75);--ac:#2dd4bf;--ac2:#818cf8;--ok:#34d399;--wn:#fbbf24;--bad:#fb7185;--inp:rgba(8,13,28,.62);--ring:rgba(45,212,191,.35)}
*{box-sizing:border-box}html{scroll-padding-top:80px}
body{margin:0;color:var(--tx);background:var(--bg1),var(--bg);background-attachment:fixed;font:15px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ac)}h1,h2,h3{letter-spacing:-.2px}
/* ---- layout ---- */
.app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px 16px;background:linear-gradient(185deg,#0b2a30 0%,#0e1d3a 55%,#1a1238 100%);color:rgba(236,243,255,.82);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;box-shadow:inset -1px 0 0 rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}.logo{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:24px;background:#fdf7ec;box-shadow:0 10px 24px -10px rgba(0,0,0,.45);overflow:hidden}.lbox .logo{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.bt{min-width:0}.bt h1{font-size:17px;margin:0;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:11.5px;color:rgba(200,214,240,.6)}
.ng{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:rgba(190,205,235,.5);padding:16px 12px 6px}
.ni{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;margin:2px 0;border-radius:12px;text-decoration:none;color:rgba(236,243,255,.8);font-size:14.5px;font-weight:500;transition:.15s}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}.ni.on{color:#fff;background:linear-gradient(135deg,rgba(45,212,191,.28),rgba(129,140,248,.3));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 8px 20px -10px rgba(45,212,191,.6)}
.ni.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:#2dd4bf}
.nic{display:grid;place-items:center;width:22px;height:22px;flex:none}.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;border-radius:10px;font:700 11px/1 system-ui,sans-serif;color:#fff;background:var(--wn)}.nb.bad{background:var(--bad)}
.sidefoot{margin-top:18px;padding:12px;font-size:11px;color:rgba(190,205,235,.45);text-align:center}
.main{min-width:0}.content{max-width:1240px;margin:0 auto;padding:6px 24px 96px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.pt{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;letter-spacing:-.3px}.pt .ic{width:22px;height:22px;color:var(--ac)}.pt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.tools button{min-height:36px;padding:6px 12px;border-radius:12px;font-size:13px}
.burger{display:none;min-height:38px;padding:8px 10px}.scrim{display:none}.tabbar{display:none}
@media(max-width:900px){.app{display:block}.side{position:fixed;left:0;top:0;bottom:0;width:292px;z-index:60;transform:translateX(-105%);transition:transform .25s ease;height:auto;padding-top:calc(20px + env(safe-area-inset-top,0px))}body.menu-open .side{transform:none}body.menu-open .scrim{display:block;position:fixed;inset:0;z-index:55;background:rgba(5,10,25,.55);backdrop-filter:blur(2px)}.burger{display:inline-flex}.topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}.content{padding:4px 14px 110px}.tools button{padding:6px 9px}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
 .tb{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--mut);font-size:11px;font-weight:600;background:none;border:0;min-height:0}.tb.on{color:var(--ac)}.tb .ic{width:22px;height:22px}.tb .nb{position:absolute;top:2px;left:calc(50% + 6px)}}
/* ---- cards & basics ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin:14px 0;box-shadow:var(--sh)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
h2{font-size:17px;margin:0 0 2px;font-weight:700}h3{font-size:12px;margin:20px 0 9px;color:var(--mut);text-transform:uppercase;letter-spacing:.9px;font-weight:700}
.s{color:var(--mut);font-size:13px;margin:2px 0 10px}.big{font-size:22px}.ok{color:var(--ok)}.wn{color:var(--wn)}.bad{color:var(--bad)}
.abar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.pill{text-decoration:none;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:20px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 10%,var(--card));color:var(--mut)}.pill.wn{color:var(--wn)}.pill.bad{color:var(--bad)}.pill.ok{color:var(--ok)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(185px,100%),1fr));gap:12px}

VIEWS.help=()=>`<div class="card"><h2>❓ Paano Gamitin</h2><p class="s">Mini-POS ito: <b>isang beses lang ang setup</b>, tapos <b>Encoder</b> na lang araw-araw.</p>
 <h3>Ang daloy</h3><ol class="st"><li><b>Setup (isang beses):</b> <a href="#set">⚙️ Setup</a> (gamit, buwanang gastos) → <a href="#inv">📦 Inventory</a> (presyo ng supplies, stock; "Ayusin stock" para itama ang bilang) → <a href="#prod">🏷️ Produkto</a> (recipe, picture).</li>
 <li><b>Araw-araw:</b> <a href="#enc">✍️ Encoder</a> → ilagay ang order, materyales, sayang, presyo, at bayad (buo / down payment / utang) → <b>I-save</b>.</li>
 <li><b>Awtomatiko pagka-save:</b> bumababa ang stock · may tala sa Inventory Log · papasok ang bayad sa Cash Flow · nasa History · kapag may balanse, <b>naka-pin sa Dashboard</b> bilang Pending Payment · kapag mababa na ang stock, lalabas din sa pinned Stock Alerts.</li>
 <li><b>Kapag nagbayad ang customer ng balanse:</b> pindutin ang <b>Bayaran</b> sa Dashboard, History, o Cash Flow.</li>
 <li><b>Tuwing may bibilhin:</b> Inventory → Mag-restock. <b>Tuwing maglilinis ng printer:</b> Maintenance.</li>
 <li><b>Katapusan ng buwan:</b> Dashboard (kumita ba?) → Funds (hatiin ang kita) → Backup.</li></ol>
 <h3>Kulay ng stock</h3><p class="s" style="font-size:14px"><span class="ok">● Berde</span> = sapat pa · <span class="wn">● Dilaw</span> = malapit nang maubos (≤ dilaw na limit) · <span class="bad">● Pula</span> = pawala na (≤ pulang limit) o ubos na. Ang limit ay nai-e-edit sa Inventory.</p>
 <h3>Halimbawa: 15 pcs Motor Sticker × ₱20</h3><p class="s" style="font-size:14px">Materyales: 1 photo sticker, 1 vinyl, 1 transfer tape. Sayang: 1 photo sticker at 1 vinyl (namali). Pindutin ang button para makita kung paano ito lalabas sa History, Inventory, at Cash Flow. Pwede mo itong burahin pagkatapos.</p><button class="p" data-a="smp">▶ Ilagay ang sample na order</button>
 <h3>Paano kinukuwenta</h3><p class="s" style="font-size:14px;line-height:1.8"><b>Halaga ng supply</b> = presyo ng pack ÷ laman ng pack<br><b>Natitira</b> = opening stock + restock − gamit − sayang ± ayos<br><b>Materyales</b> = Σ (dami na ginamit × halaga bawat isa)<br><b>Sayang</b> = Σ (dami ng nasira × halaga), kasama sa gastos<br><b>Sahod</b> = sahod/oras × (minuto ÷ 60)<br><b>Overhead</b> = (buwanang gastos + depreciation) ÷ kabuuang minuto ng trabaho/buwan × minuto ng order<br><b>Gastos</b> = Materyales + Sayang + Sahod + Overhead<br><b>Suggested / pc</b> = Gastos × (1 + markup%) ÷ dami, binawasan ng bulk discount, naka-round up<br><b>Pending</b> = Total − lahat ng bayad<br><b>Tubo ng order</b> = Benta − Materyales − Sayang<br><b>Net kita ng buwan</b> = Benta − Materyales − Sayang − Maintenance − Gastos − Fixed<br><b>Fund</b> = Net kita × % ng fund</p>
 <h3>Mga tanong</h3><p class="s" style="font-size:14px;line-height:1.7"><b>Bakit negative ang stock?</b> Kulang ang bilang na nilagay. Gamitin ang "Ayusin stock".<br><b>Nagkamali ng order?</b> Burahin sa History (babalik ang supplies) at i-encode ulit.<br><b>Bakit kasama ang sahod ko sa presyo?</b> Para hindi "libre" ang trabaho mo. Galing ito sa Net Kita (Fund: Sahod ko).<br><b>Paano maglagay ng picture ng produkto?</b> Produkto → I-edit → Mag-upload ng picture.<br><b>Paano ilipat sa ibang device?</b> Setup → Backup, tapos Ibalik sa kabila.</p></div>`;

const EX=new Map();const DICT=RAW.split('\n').map(l=>l.trim()).filter(l=>l.includes('>>')).map(l=>{const i=l.lastIndexOf('>>');return[l.slice(0,i),l.slice(i+2)]}).filter(p=>{if(p[0][0]==='!'){EX.set(p[0].slice(1).toLowerCase(),p[1]);return false}return p[0]&&p[0]!=='ang'});
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),MAP=new Map();DICT.forEach(p=>{if(!MAP.has(p[0].toLowerCase()))MAP.set(p[0].toLowerCase(),p[1])});
const keys=[...MAP.keys()].sort((a,b)=>b.length-a.length);
const RX=new RegExp('(?<![A-Za-zÀ-ÿ])('+keys.map(esc).join('|')+')(?![A-Za-zÀ-ÿ])','gi');
const trText=s=>{const t=String(s).trim().toLowerCase();if(EX.has(t))return String(s).replace(/\S[\s\S]*\S|\S/,EX.get(t));return trTxt(s)};
const trTxt=s=>String(s).replace(RX,m=>{let r=MAP.get(m.toLowerCase());if(r===undefined)return m;if(m===m.toUpperCase()&&/[A-Z]/.test(m)&&m.length>2)return r.toUpperCase();if(/^[A-Z]/.test(m)&&/^[a-z]/.test(r))r=r[0].toUpperCase()+r.slice(1);return r});
const en=()=>S()&&S().set.lang==='en';P.tr=s=>en()?trText(s):s;
const walk=root=>{if(!root)return;const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const nodes=[];while(n=tw.nextNode())nodes.push(n);nodes.forEach(n=>{const pe=n.parentElement;if(!pe||pe.closest('[data-nt],.inv,textarea,script,style,code,pre'))return;const v=n.nodeValue;if(/[A-Za-z]/.test(v)){const t=trText(v);if(t!==v)n.nodeValue=t}});root.querySelectorAll('[placeholder],[title]').forEach(e=>['placeholder','title'].forEach(a=>{const v=e.getAttribute(a);if(v)e.setAttribute(a,trText(v))}))};

document.addEventListener('pointermove',e=>{if(!DRAG)return;const pn=$('#aipanel');if(!pn)return;const x=Math.max(8,Math.min(innerWidth-pn.offsetWidth-8,e.clientX-DRAG.dx)),y=Math.max(8,Math.min(innerHeight-60,e.clientY-DRAG.dy));pn.style.left=x+'px';pn.style.top=y+'px'});
document.addEventListener('pointerup',()=>{const pn=$('#aipanel');if(!pn||pn.style.display==='none'||innerWidth<=600){DRAG=null;return}const r=pn.getBoundingClientRect(),np={x:Math.round(r.left),y:Math.round(r.top),w:pn.offsetWidth,h:pn.offsetHeight};if(DRAG||!PPOS||np.w!==PPOS.w||np.h!==PPOS.h){PPOS=np;ls('pos_ai_ppos',JSON.stringify(PPOS))}DRAG=null});
window.addEventListener('resize',()=>{const pn=$('#aipanel');if(pn&&pn.style.display!=='none')place(pn)});
Object.assign(ACT,{aisend:px=>{px=px||'ai';const t=document.getElementById(px+'-t');send(t?t.value:DR[px],px)},aichip:i=>send(CHIPS()[+i][1],location.hash==='#ai'?'ai':'aip'),aiset:()=>{SHOWSET=!SHOWSET;draw()},
 aiok:id=>{const f=PEND[id];delete PEND[id];if(f)f(true)},aino:id=>{const f=PEND[id];delete PEND[id];if(f)f(false)},
 aistop:()=>{STOP=true;RUN.forEach(a=>a.abort());Object.keys(PEND).forEach(k=>{const f=PEND[k];delete PEND[k];f(false)});STATUS=L('Itinitigil…','Stopping…');tickNow()},
 aipanel:()=>{PANEL=!PANEL;ls('pos_ai_panel',PANEL?'1':'');syncFab();if(PANEL){drawPanel();setTimeout(()=>{const t=$('#aip-t');if(t&&innerWidth>600)t.focus()},50)}},
 aipclose:()=>{PANEL=false;ls('pos_ai_panel','');syncFab()},aipop:()=>{PANEL=true;ls('pos_ai_panel','1');location.hash='#dash'},
 aipfull:()=>{PANEL=false;ls('pos_ai_panel','');location.hash='#ai'},aipsetup:()=>{PANEL=false;ls('pos_ai_panel','');SHOWSET=true;if(location.hash==='#ai')P.render();else location.hash='#ai'},
 aiclear:()=>{if(BUSY)return;if(MSGS.length&&!confirm(L('Simulan ang bagong usapan? Mabubura ang chat history (hindi ang data).','Start a new chat? The chat history is cleared (not your data).')))return;MSGS=[];CH=[];persist();draw()},
 aiprobe:async()=>{await probe(true);toast(L(`⚡ Gagamitin: ${curModel()}`,`⚡ Using: ${curModel()}`))},
 aisave:()=>{const k=$('#ai-k').value.trim();if(k)ls(K.key,k);ls(K.model,$('#ai-m').value);if($('#ai-k').value.trim()){HEALTH={};saveH();setTimeout(()=>probe(true),300)}ls(K.auto,$('#ai-auto').value==='1'?'1':'');BAD={};ls('pos_ai_bad','');if(lg(K.key))SHOWSET=false;toast(L('Na-save ang AI settings','AI settings saved'));P.render()},
 aidelkey:()=>{if(confirm(L('Alisin ang API key sa device na ito?','Remove the API key from this device?'))){ls(K.key,'');SHOWSET=true;P.render()}},
 aitest:async()=>{const inp=$('#ai-k').value.trim(),k=inp||lg(K.key),st=$('#ai-st');if(!k){toast(L('Ilagay ang API key.','Enter the API key.'));return}if(st)st.textContent='⏳…';
  try{const r=await fetch(`${API}/models?pageSize=200`,{headers:{'x-goog-api-key':k}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((ERRS[r.status]?L(ERRS[r.status][0],ERRS[r.status][1]):'HTTP '+r.status)+(j.error?' — '+j.error.message:''));
   const list=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/gemini/.test(m.name)&&/flash/.test(m.name)&&!/(image|tts|audio|live|embedding|robotics|transcribe|computer|thinking-exp|omni|native)/.test(m.name)).map(m=>m.name.replace('models/',''));
   const rank=m=>(/lite/.test(m)?1:0)+(/preview|exp/.test(m)?2:0)+(/latest/.test(m)?0.5:0)-parseFloat((m.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1])/10;list.sort((a,b)=>rank(a)-rank(b));
   if(inp)ls(K.key,inp);if(list.length){ls(K.models,JSON.stringify(list));if(!list.includes(lg(K.model)))ls(K.model,'auto')}SHOWSET=true;P.render();toast(L(`✅ Gumagana ang key! Sinusubukan ang ${Math.min(8,list.length)} model…`,`✅ Key works! Testing ${Math.min(8,list.length)} models…`));await probe(true);const okN=models().slice(0,8).filter(m=>HEALTH[m]&&HEALTH[m].ok).length;toast(okN?L(`⚡ ${okN} model ang gumagana. Gagamitin ang ${curModel()}.`,`⚡ ${okN} models work. Using ${curModel()}.`):L('⚠ Walang model na sumagot ngayon. Subukan ulit mamaya.','⚠ No model answered right now. Try again later.'));P.render()}
  catch(e){if(st)st.textContent='⚠ '+e.message;else toast('⚠ '+e.message)}},
 aimic:px=>{px=px||'ai';if(!MIC)return;if(rec){rec.stop();return}rec=new SR();rec.lang=S().set.lang==='en'?'en-PH':'fil-PH';rec.interimResults=false;rec.onresult=e=>{const t=document.getElementById(px+'-t'),v=Array.from(e.results).map(r=>r[0].transcript).join(' ');DR[px]=((t?t.value:DR[px])+' '+v).trim();if(t)t.value=DR[px]};rec.onend=()=>{rec=null;toast(L('🎤 Tapos','🎤 Done'))};rec.onerror=()=>{rec=null};rec.start();toast(L('🎤 Nakikinig… magsalita na','🎤 Listening… speak now'))}});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='ai-t')DR.ai=e.target.value;else if(id==='aip-t')DR.aip=e.target.value});
document.addEventListener('keydown',e=>{const id=e.target.id;if((id==='ai-t'||id==='aip-t')&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ACT.aisend(id==='ai-t'?'ai':'aip')}});
/* dashboard card + floating button */
HOOKS.pins.unshift(()=>`<div class="card pin in"><div class="ch"><h2>🤖 AI Assistant</h2><a href="#ai">${L('Buksan','Open')} →</a></div><p class="s">${L('Hayaan ang AI na suriin ang data at sabihin kung ano ang uunahin ngayon.','Let the AI review your data and tell you what to prioritize today.')}</p><div class="f"><button class="p" data-a="aibrief">📋 ${L('Plano ko ngayong araw','My plan for today')}</button><button data-a="aiopen">💬 ${L('Magtanong','Ask')}</button></div></div>`);
Object.assign(ACT,{aibrief:()=>P.aiAsk(CHIPS()[0][1]),aiopen:()=>{PANEL=false;ACT.aipanel()}});
HOOKS.after.push(syncFab);
P.aiTools={TOOLS,W,READ,overview,search,getRecord,send,preview,state:()=>({BUSY,PANEL,CURM,BAD,MSGS})};
})();

</script>
<script>
POS.start();
